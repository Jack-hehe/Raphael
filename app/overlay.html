<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raphael overlay</title>
    <style>
      /* The overlay window is transparent and click-through: keep the page transparent from the
         first paint, before overlay.css has loaded. */
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
  </head>

  <body>
    <canvas id="emblem" aria-hidden="true"></canvas>
    <div id="progress" class="progress" role="progressbar" aria-label="處理進度" aria-valuemin="0" aria-valuemax="100" hidden></div>
    <div id="subtitles" class="subs" aria-live="polite">
      <div class="sub-zh"></div>
      <div class="sub-ja" lang="ja"></div>
    </div>
    <script type="module" src="/src/overlay/overlay.ts"></script>
  </body>
</html>
