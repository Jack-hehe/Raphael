[package]
name = "app"
version = "0.2.0"
description = "Raphael: a tray app for dictation and voice assistance"
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
# Only the Rust library that main.rs and the tests use. Tauri's template adds "staticlib" and
# "cdylib" for builds on iOS and Android, which Raphael does not have; every build would make them.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
# Vendored copy of handy-keys 0.3.4 (crates.io package, commit e7d1b8e), patched: held modifier
# keys are swallowed whole, injected key events are ignored, Space may go down before Right Alt,
# and an edit observer serves learning from corrections. See the note at the top of
# vendor/handy-keys/src/platform/windows/listener.rs.
handy-keys = { path = "vendor/handy-keys" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
# Pasting (src/paste): the paste key chord.
enigo = "0.6"
# The `#[implement]` of the UI Automation focus handler (src/learn/uia.rs) expands to
# `::windows_core` paths, so the crate the `windows` crate below uses must be a dependency too.
windows-core = "0.62"
# The asynchronous operations of the Windows Runtime (`IAsyncOperation`), which the media controls
# answer with. It is the version the `windows` crate below already uses.
windows-future = "0.3"
# The overlay's webview: whether its WebView2 controller shows it and fills the window, and the
# failures of its processes. The version Tauri and wry use, so the controller they hand over is
# this crate's type.
webview2-com = "0.39"
# 0.62 is the version Tauri 2.12 uses, so the HWND types match. Used by the overlay (Alt+Tab,
# whether the person can see it: cloaking, virtual desktops; and what happens to the screen: the
# display's power, the session), pasting (clipboard, focus), the core process (Job Object), the
# settings page's AltGr check (keyboard layouts), learning from corrections (UI Automation, COM,
# the Chinese word breaker) and pausing the media that plays during a recording (the media
# controls). `Data_Text` and `Media_Control` bring `Foundation` with them, and the lists their
# calls return come from windows-collections, which `windows` always uses.
windows = { version = "0.62", features = [
  "Data_Text",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# Tests of the controller's timers (a question that is not answered, an answer on screen) run on
# a clock that they move themselves.
tokio = { version = "1", features = ["test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
