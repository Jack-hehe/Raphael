<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Raphael - Open Halo</title>
  <desc>An original pearl and pale-cyan listening halo on a midnight-indigo rounded square.</desc>
  <defs>
    <linearGradient id="plate" x1="120" y1="32" x2="870" y2="992" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182642"/>
      <stop offset="0.48" stop-color="#10192f"/>
      <stop offset="1" stop-color="#090e20"/>
    </linearGradient>
    <radialGradient id="ambient" cx="280" cy="170" r="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73cedf" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#73cedf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="light" x1="370" y1="200" x2="690" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5fdff"/>
      <stop offset="0.48" stop-color="#dffaff"/>
      <stop offset="1" stop-color="#9ce6f5"/>
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <path id="halo" d="M 803.503 460.713 A 296 296 0 1 1 613.238 233.851"/>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#plate)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#ambient)"/>
  <use href="#halo" fill="none" stroke="#7dddec" stroke-width="106" stroke-linecap="round" opacity="0.2" filter="url(#bloom)"/>
  <use href="#halo" fill="none" stroke="url(#light)" stroke-width="104" stroke-linecap="round"/>
</svg>
