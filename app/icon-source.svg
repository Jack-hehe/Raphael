<?xml version="1.0" encoding="UTF-8"?>
<!--
  Raphael app icon, drawn from plain shapes (no pixels from the anime).
  Source for `npx tauri icon icon-source.svg`.
  Canvas 1024 x 1024, centre (512, 512). R = 460 is the emblem radius:
    dark disc          #0F0B08 (radius 508, the dark base the spec asks for)
    thin dark circles  at 0.73R (335.8) and 1.0R (460)
    dashed ring        #FFB026 at 0.86R (395.6), 20 dashes
    15-sided ring      white at 0.6R (276), rounded corners
    core               white-gold with a soft glow
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Raphael</title>
  <defs>
    <radialGradient id="core" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="58">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.45" stop-color="#FFF3CC" />
      <stop offset="1" stop-color="#FFD36B" />
    </radialGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="150">
      <stop offset="0" stop-color="#FFD36B" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFD36B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="512" cy="512" r="508" fill="#0F0B08" />

  <circle cx="512" cy="512" r="335.8" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="6" />
  <circle cx="512" cy="512" r="460" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="6" />

  <circle
    cx="512" cy="512" r="395.6"
    fill="none" stroke="#FFB026" stroke-width="72"
    stroke-dasharray="79.54 44.741" stroke-dashoffset="39.77"
  />

  <polygon
    points="512.00,236.00 624.26,259.86 717.11,327.32 774.49,426.71 786.49,540.85 751.02,650.00 674.23,735.29 569.38,781.97 454.62,781.97 349.77,735.29 272.98,650.00 237.51,540.85 249.51,426.71 306.89,327.32 399.74,259.86"
    fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linejoin="round"
  />

  <circle cx="512" cy="512" r="150" fill="url(#glow)" />
  <circle cx="512" cy="512" r="58" fill="url(#core)" />
</svg>
