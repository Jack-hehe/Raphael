[project]
name = "raphael-core"
version = "0.2.0"
license = "MIT"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "keyring==25.7.0",
    "mcp>=2.3.0",
    "numpy>=2",
    "opencc==1.4.2",
    "sherpa-onnx==1.13.8",
    # The libraries sherpa-onnx loads (onnxruntime.dll among them). Its wheels name this package as a
    # dependency, but uv locks from the metadata of the first wheel listed (linux_armv7l), which
    # does not, so it is pinned here. Without it Windows loads its own onnxruntime.dll and crashes.
    "sherpa-onnx-core==1.13.8",
    "sounddevice==0.5.6",
    "soxr>=1.1",
]

[dependency-groups]
packaging = [
    "pyinstaller==6.22.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raphael_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "models: needs downloaded speech models (set RAPHAEL_TEST_MODELS=1)",
]
