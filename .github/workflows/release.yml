name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and verify Windows installer
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.98.0"
      RAPHAEL_TEST_MODELS: "0"
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release inputs
        run: |
          $privateDirectory = Join-Path $env:RUNNER_TEMP 'raphael-release-no-private-assets'
          if (Test-Path -LiteralPath $privateDirectory) { throw 'Expected an absent private-assets override.' }
          "RAPHAEL_PRIVATE_DIR=$privateDirectory" >> $env:GITHUB_ENV
          $privatePaths = @(
            'assets-private', 'models', 'voice', 'raphael_ref', '.superpowers', 'ui-shots',
            'eval/data', 'app/public/private', 'app/src-tauri/icons-private',
            'app/src-tauri/tauri.private.conf.json'
          )
          foreach ($path in $privatePaths) {
            if (Test-Path -LiteralPath $path) { throw "Unexpected private release input: $path" }
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # app/package.json, tauri.conf.json, Cargo.toml and core/pyproject.toml must carry the same x.y.z.
      - name: Check release versions
        working-directory: app
        run: |
          $version = node scripts/check-release-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      # Artifacts of different refs and commits must not share a name. Characters that an artifact name
      # forbids, such as the slash in a branch name, become hyphens.
      - name: Name the artifact after its source
        id: identity
        run: |
          $ref = ($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-').Trim('-')
          "artifact-name=Raphael-windows-x64-$ref-$($env:GITHUB_SHA.Substring(0, 12))" >> $env:GITHUB_OUTPUT

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          working-directory: core
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version

      # No Rust cache here: CI caches its builds, a release is compiled from scratch.
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy

      - name: Install locked frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Check frontend
        working-directory: app
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:contrast

      - name: Install locked Python build dependencies
        working-directory: core
        run: |
          uv python install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --group packaging

      - name: Check Python
        working-directory: core
        run: uv run --locked --no-sync pytest -q -ra -W error

      - name: Freeze Python core
        working-directory: core
        run: uv run --locked --no-sync python packaging/build.py

      - name: Verify frozen core
        working-directory: core
        run: uv run --locked --no-sync python packaging/smoke.py --core dist/raphael-core/raphael-core.exe

      - name: Collect dependency notices
        working-directory: app
        run: node scripts/collect-release-notices.mjs

      - name: Check Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Build public Windows installer
        working-directory: app
        run: node scripts/tauri.mjs build --config src-tauri/tauri.release.conf.json --bundles nsis --ci -- --locked

      - name: Check Rust and keyboard listener
        working-directory: app/src-tauri
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib --manifest-path vendor/handy-keys/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --release --all-targets -- -D warnings

      - name: Verify installed application
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          ./app/scripts/verify-windows-install.ps1 -Installer $installers[0].FullName -Python "$pwd/core/.venv/Scripts/python.exe"

      # The installer, the notices, BUILD-INFO.txt (commit, ref, run and tools) and SHA256SUMS.txt for all of them.
      - name: Prepare release assets and checksums
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          node app/scripts/prepare-release-assets.mjs `
            --installer $installers[0].FullName `
            --notices app/src-tauri/release-notices/THIRD_PARTY_NOTICES.txt `
            --version $env:RELEASE_VERSION `
            --output release-assets

      # The same check a downloader runs; it fails on CRLF line endings.
      - name: Check release asset checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  # Provenance only for what is published from main or a tag, and only where GitHub offers artifact
  # attestations: public repositories (private ones need GitHub Enterprise Cloud). This job alone gets
  # the two token scopes attestation needs; it checks out nothing and builds nothing.
  attest:
    name: Attest build provenance
    needs: windows-release
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows-release.outputs.artifact-name }}
          path: release-assets

      - name: Check release asset checksums
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
