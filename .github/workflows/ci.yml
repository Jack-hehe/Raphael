name: CI

# Every PR and merge-queue entry checks all layers and renders the real UI. Only
# changed UI opts into the paid judge. Dependency pushes refresh the Rust cache.
on:
  push:
    branches: [main]
    paths:
      - "app/src-tauri/Cargo.lock"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/vendor/handy-keys/Cargo.toml"
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Choose the jobs to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.pick.outputs.frontend }}
      python: ${{ steps.pick.outputs.python }}
      rust: ${{ steps.pick.outputs.rust }}
      ui: ${{ steps.pick.outputs.ui }}
    steps:
      - name: List the changed files
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out() { echo "frontend=$1" >> "$GITHUB_OUTPUT"; echo "python=$2" >> "$GITHUB_OUTPUT"; echo "rust=$3" >> "$GITHUB_OUTPUT"; echo "frontend=$1 python=$2 rust=$3"; }
          case "$EVENT" in
            workflow_dispatch|merge_group) out true true true; echo 'ui=true' >> "$GITHUB_OUTPUT"; exit 0 ;;
            push) out false false true; exit 0 ;;  # only the Rust dependencies start a push run
          esac
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          ui=false
          if printf '%s\n' "$files" | grep -Eq '^app/(src/|index\.html|overlay\.html|scripts/look/)'; then ui=true; fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          # Every PR checks repository contracts and all three implementation layers.
          out true true true

  frontend:
    name: Frontend tests and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify frontend, product rules and architecture
        run: npm run verify

      - name: Type-check and build frontend
        run: npm run build

      - name: Capture real UI in both themes and all three sizes
        env:
          LOOK_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: npm run look -- --all --theme both --width 1120,720,1920x1080

      - name: Determine paid design review availability
        if: always() && needs.changes.outputs.ui == 'true'
        id: judge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if ($env:OPENROUTER_API_KEY) { 'enabled=true' >> $env:GITHUB_OUTPUT }
          else {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Output '::notice::Design judge SKIP: OPENROUTER_API_KEY is unavailable (including fork PRs). This is not a design PASS.'
            'Design judge: SKIP (no secret); no visual-model acceptance claimed.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Set up uv for design judge
        if: steps.judge.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          working-directory: core

      - name: Install judge dependencies
        if: steps.judge.outputs.enabled == 'true'
        working-directory: core
        run: uv sync --locked --dev

      - name: Restore image-hash design cache
        if: steps.judge.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: app/.look/judge-cache
          key: design-judge-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: design-judge-${{ runner.os }}-

      - name: Fetch pinned external reference images
        if: steps.judge.outputs.enabled == 'true'
        env:
          RAPHAEL_JUDGE_REFERENCE_MANIFEST: ${{ vars.RAPHAEL_JUDGE_REFERENCE_MANIFEST }}
        run: node scripts/judge-references.mjs

      - name: Judge changed UI with a bounded budget
        if: steps.judge.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RAPHAEL_JUDGE_MODEL: ${{ vars.RAPHAEL_JUDGE_MODEL || 'anthropic/claude-sonnet-4.6' }}
        run: |
          $lookRun = Get-ChildItem .look -Directory -Filter 'run-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $lookRun) { throw 'No look run available for judge.' }
          $refs = Get-Content .look/references/paths.json -Raw | ConvertFrom-Json
          $env:RAPHAEL_JUDGE_REFERENCES = ConvertTo-Json -InputObject @($refs) -Compress
          npm run judge -- $lookRun.FullName --max-cost-usd 15 --request-ceiling 0.10 --max-requests 1398

      - name: Preserve valid cached reviews even when later images fail
        if: always() && steps.judge.outputs.enabled == 'true'
        uses: actions/cache/save@v4
        with:
          path: app/.look/judge-cache
          key: design-judge-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload look, judge and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/.look/run-*/report.json
            app/.look/run-*/*.png
            app/.look/run-*/contacts.json
            app/.look/judge-*/report.json
            app/.look/judge-*/summary.txt
            app/.look/verify-*/*
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: core
    env:
      RAPHAEL_TEST_MODELS: "0"
      # Subprocesses also fail closed; conftest installs a fresh memory keyring per test.
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          working-directory: core
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version

      - name: Install pinned Python
        run: uv python install

      - name: Install locked Python dependencies
        run: uv sync --locked --dev

      - name: Run Python tests with warnings denied
        run: uv run --locked --no-sync pytest -q -ra -W error

  windows-shell:
    name: Windows Rust and Tauri shell
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: app/src-tauri
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for files that must not be committed
        working-directory: .
        run: |
          $excluded = @("models", "voice", "raphael_ref", ".superpowers", "ui-shots", "eval/data")
          foreach ($path in $excluded) {
            if (Test-Path -LiteralPath $path) {
              throw "The checkout must not contain: $path"
            }
          }

      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # main's cache is the fallback for every pull request; a pull request also saves its own,
      # which only its later runs can restore, so they skip the dependencies it changed.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            app/src-tauri -> target
            app/src-tauri/vendor/handy-keys -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: app
        run: npm ci

      # This runs beforeBuildCommand, embeds the real frontend, and links the Windows executable.
      - name: Build Tauri debug application
        working-directory: app
        run: node scripts/tauri.mjs build --debug --no-bundle --ci -- --locked

      - name: Run Rust tests
        run: cargo test --locked

      # The patched keyboard listener is a path dependency, so its tests need a separate run.
      - name: Run vendored keyboard listener unit tests
        run: cargo test --locked --lib --manifest-path vendor/handy-keys/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

  required:
    name: Guardian required gates
    needs: [changes, frontend, python, windows-shell]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every implementation and rendered gate
        env:
          FRONTEND: ${{ needs.frontend.result }}
          PYTHON: ${{ needs.python.result }}
          RUST: ${{ needs.windows-shell.result }}
        run: |
          test "$FRONTEND" = success
          test "$PYTHON" = success
          test "$RUST" = success
